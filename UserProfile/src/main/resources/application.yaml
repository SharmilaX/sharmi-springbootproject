server:
  port: 8080

spring:
  application:
    name: UserProfile
  datasource:
    url: jdbc:h2:file:C:/Users/562485/test;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    Password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-profile-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.SharmiSpringBoot.UserProfile.kafka.payload"
        spring.json.type.mapping: "userProfileEvent:com.example.SharmiSpringBoot.UserProfile.kafka.payload.UserProfileEvent"

